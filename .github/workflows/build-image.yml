name: Build & publish dispatcher image to GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devin-dispatcher:latest
            ghcr.io/${{ github.repository_owner }}/devin-dispatcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
